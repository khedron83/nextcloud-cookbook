name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: nextcloud-cookbook-linux
            dist_name: nextcloud-cookbook
          - os: windows-latest
            artifact: nextcloud-cookbook-windows
            dist_name: nextcloud-cookbook

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Install Qt platform deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0 libdbus-1-3 \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Build with PyInstaller
        run: pyinstaller cookbook.spec

      - name: Zip artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact }}.zip ${{ matrix.dist_name }}/

      - name: Zip artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path ${{ matrix.dist_name }}/ -DestinationPath ../${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 30

  flatpak:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Cache Flatpak runtimes
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-kde-6.9-${{ hashFiles('python3-deps.json') }}

      - name: Install Flatpak runtimes
        run: |
          flatpak install --user --noninteractive flathub \
            org.kde.Platform//6.9 \
            org.kde.Sdk//6.9 \
            io.qt.PySide.BaseApp//6.9

      - name: Build Flatpak
        run: |
          flatpak-builder --user --install --force-clean \
            build-dir io.github.khedron83.NextcloudCookbook.yml

      - name: Create bundle
        run: |
          flatpak build-bundle \
            ~/.local/share/flatpak/repo \
            nextcloud-cookbook.flatpak \
            io.github.khedron83.NextcloudCookbook \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-cookbook-flatpak
          path: nextcloud-cookbook.flatpak
          retention-days: 30

  release:
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.prerelease) }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.flatpak
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
