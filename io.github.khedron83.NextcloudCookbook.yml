app-id: io.github.khedron83.NextcloudCookbook
base: io.qt.PySide.BaseApp
base-version: '6.9'
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: nextcloud-cookbook
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --device=dri

modules:

  # ── Small pip dependencies (PySide6 comes from the BaseApp) ────────────────
  # Regenerate with:
  #   .venv/bin/python -m flatpak_pip_generator \
  #     --runtime org.kde.Sdk//6.9 \
  #     requests beautifulsoup4 \
  #     -o python3-deps.json
  - python3-deps.json

  # ── Nextcloud Cookbook ─────────────────────────────────────────────────────
  - name: nextcloud-cookbook
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
      - install -Dm644 app/resources/icon.svg
          /app/share/icons/hicolor/scalable/apps/io.github.khedron83.NextcloudCookbook.svg
      - install -Dm644 io.github.khedron83.NextcloudCookbook.desktop
          /app/share/applications/io.github.khedron83.NextcloudCookbook.desktop
      - install -Dm644 io.github.khedron83.NextcloudCookbook.metainfo.xml
          /app/share/metainfo/io.github.khedron83.NextcloudCookbook.metainfo.xml
    sources:
      - type: dir
        path: .
